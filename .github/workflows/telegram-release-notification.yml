name: Telegram Release Notification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to announce
        required: true
        type: string

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          TEXT="$(RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          print(
              f"🚀 Новый релиз: {release['name']}\n\n"
              f"🏷 Версия: {release['tag_name']}\n\n"
              f"{release.get('body') or ''}\n\n"
              f"🔗 {release['html_url']}"
          )
          PY
          )"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=false"
